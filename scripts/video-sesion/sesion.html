<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Sesión simulada RT Magneto</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Simulación de una sesión de NQ con RT Magneto en NinjaTrader.
// Recrea la captura public/img/rt-magneto-nq.webp: las velas se forman una a una,
// los niveles de RT Magneto se encienden cuando el precio los toca y el subgráfico
// de sentimiento sigue el movimiento de cada vela.
// Todo se dibuja en el espacio de la captura (2000 × 1138) y se escala al lienzo.
// scripts/video-sesion.mjs llama a renderAt(t) fotograma a fotograma y graba el video.

const params = new URLSearchParams(location.search);
const OUT_W = Number(params.get('w') || 1920);
const W = 2000, H = 1138;
const SCALE = OUT_W / W;
const cv = document.getElementById('c');
cv.width = OUT_W; cv.height = Math.round(H * SCALE);
const ctx = cv.getContext('2d');

// ---------- Geometría ----------
const AXIS_X = 1930;              // borde izquierdo del eje de precios
const MAIN_TOP = 38, MAIN_BOT = 872;
const SUB_TOP = 878, SUB_BOT = 1128, SUB_ZERO = 970;
const SESSION_X = 213;            // línea discontinua de inicio de sesión
const X0 = 222, X1 = 1585, N = 196;
const STEP = (X1 - X0) / (N - 1);
const bx = (i) => X0 + i * STEP;
const yToP = (y) => 29320 - (y - 112) * 0.4658;
const pToY = (p) => 112 + (29320 - p) / 0.4658;
const subY = (v) => SUB_ZERO - v * 0.01375;

// ---------- Tiempos ----------
const FPS = Number(params.get('fps') || 30);
const LEAD = 0.5, BAR = 0.13, HOLD = 2.6, FADE = 0.9;
const SESSION = N * BAR;
const DURATION = LEAD + SESSION + HOLD + FADE;
window.DURATION = DURATION; window.FPS = FPS;

// ---------- Azar reproducible ----------
let seed = 20261102;
function rand() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function gauss() { return (rand() + rand() + rand() - 1.5) * 1.15; }
function interp(path, x) {
  if (x <= path[0][0]) return path[0][1];
  for (let k = 1; k < path.length; k++) {
    if (x <= path[k][0]) {
      const [xa, ya] = path[k - 1], [xb, yb] = path[k];
      const f = (x - xa) / (xb - xa);
      const s = f * f * (3 - 2 * f); // suave entre puntos clave
      return ya + (yb - ya) * (0.35 * f + 0.65 * s);
    }
  }
  return path[path.length - 1][1];
}

// ---------- Recorrido del precio (y en píxeles de la captura) ----------
const PRICE_PATH = [
  [222,560],[240,620],[252,640],[265,560],[280,600],[300,690],[315,610],[335,500],[350,520],[365,580],
  [385,560],[405,600],[420,520],[440,485],[460,460],[480,445],[500,430],[520,360],[545,340],[565,300],
  [585,248],[600,300],[620,312],[640,330],[660,392],[690,388],[705,392],[720,335],[745,300],[760,250],
  [780,200],[800,150],[815,132],[830,128],[850,168],[870,210],[895,270],[915,330],[930,392],[945,380],
  [960,440],[980,472],[995,500],[1010,478],[1030,500],[1050,450],[1065,398],[1080,440],[1095,482],[1110,460],
  [1125,482],[1145,540],[1160,500],[1175,458],[1195,500],[1215,512],[1235,498],[1250,540],[1270,562],[1290,590],
  [1310,600],[1330,622],[1345,680],[1360,732],[1375,770],[1390,722],[1405,682],[1420,622],[1440,600],[1460,570],
  [1480,558],[1500,548],[1520,588],[1540,560],[1560,520],[1575,532],[1585,542],
];
const bars = [];
let prevClose = yToP(560);
for (let i = 0; i < N; i++) {
  const target = yToP(interp(PRICE_PATH, bx(i)));
  const close = target + gauss() * 3.2;
  const open = i === 0 ? close + 3 : prevClose + gauss() * 0.6;
  const high = Math.max(open, close) + 0.8 + rand() * rand() * 7;
  const low = Math.min(open, close) - 0.8 - rand() * rand() * 7;
  bars.push({ open, close, high, low, hiFirst: close < open ? true : rand() < 0.3 });
  prevClose = close;
}
// Precio dentro de la vela: apertura → primer extremo → segundo extremo → cierre
function intra(b, u) {
  const a = b.hiFirst ? b.high : b.low, c = b.hiFirst ? b.low : b.high;
  const e = (x) => x * x * (3 - 2 * x);
  if (u < 0.28) return b.open + (a - b.open) * e(u / 0.28);
  if (u < 0.72) return a + (c - a) * e((u - 0.28) / 0.44);
  return c + (b.close - c) * e((u - 0.72) / 0.28);
}

// ---------- Zero Gamma 0DTE (amarillo) ----------
const ZERO_PATH = [[222,430],[240,472],[280,560],[330,600],[380,585],[420,560],[500,535],[600,492],[700,432],
  [800,395],[880,378],[960,350],[1040,368],[1100,380],[1180,386],[1240,410],[1300,412],[1360,416],[1400,396],
  [1440,428],[1500,436],[1540,440],[1585,450]];

// ---------- Niveles punteados de RT Magneto ----------
const C = {
  green: '#3ee23e', salmon: '#f7a07c', cyan: '#3fe6ea', dark: '#8a0a0a', red: '#c8264a',
  blue: '#1d1df0', yellow: '#f2ee28', purple: '#9b3fd0', pink: '#e0337a', ring: '#4ee08a',
};
const LEVELS = [
  { y: 48, x0: 270, x1: 1020, c: C.green, gap: 0.55 },
  { y: 142, x0: 760, x1: 1080, c: C.salmon },
  { y: 154, x0: 725, x1: 790, c: C.blue },
  { y: 262, x0: 430, x1: 750, c: C.green },
  { y: 262, x0: 900, x1: 1200, c: C.green, gap: 0.25 },
  { y: 320, x0: 1090, x1: 1430, c: C.salmon, gap: 0.3 },
  { y: 330, x0: 650, x1: 720, c: C.blue },
  { y: 370, x0: 1200, x1: 1570, c: C.green, gap: 0.45 },
  { y: 407, x0: 355, x1: 510, c: C.salmon },
  { y: 407, x0: 1440, x1: 1570, c: C.salmon, gap: 0.35 },
  { y: 440, x0: 1195, x1: 1240, c: C.blue },
  { y: 478, x0: 770, x1: 880, c: C.cyan },
  { y: 496, x0: 240, x1: 330, c: C.salmon },
  { y: 498, x0: 780, x1: 1010, c: C.dark, gap: 0.5 },
  { y: 585, x0: 680, x1: 870, c: C.dark, gap: 0.3 },
  { y: 585, x0: 1400, x1: 1580, c: C.dark, gap: 0.2 },
  { y: 668, x0: 550, x1: 760, c: C.cyan },
  { y: 668, x0: 885, x1: 1080, c: C.cyan },
  { y: 668, x0: 1245, x1: 1580, c: C.cyan },
  { y: 672, x0: 480, x1: 660, c: C.dark },
  { y: 692, x0: 240, x1: 1580, c: C.red },
  { y: 694, x0: 1245, x1: 1545, c: C.blue, gap: 0.15 },
  { y: 715, x0: 365, x1: 545, c: C.cyan },
  { y: 762, x0: 220, x1: 460, c: C.dark },
];
for (const L of LEVELS) {
  L.p = yToP(L.y);
  L.dots = [];
  for (let x = L.x0; x <= L.x1; x += STEP) if (rand() > (L.gap || 0.06)) L.dots.push(x + gauss() * 0.4);
}

// ---------- Escalera GEX a la derecha ----------
const LADDER = [
  { y: 348, len: 52, c: C.green, t: '663' }, { y: 370, len: 32, c: C.red }, { y: 391, len: 72, c: C.green, t: '791' },
  { y: 412, len: 56, c: C.green, t: '602' }, { y: 426, len: 34, c: C.red }, { y: 436, len: 30, c: C.red },
  { y: 477, len: 455, c: C.red, t: '-5K' }, { y: 498, len: 292, c: C.red, t: '-3K' },
  { y: 520, len: 482, c: C.green, t: '5K' }, { y: 531, len: 360, c: C.green, t: '3K' },
  { y: 541, len: 226, c: C.red, t: '-3K' }, { y: 563, len: 242, c: C.red, t: '-3K' },
  { y: 585, len: 392, c: C.green, t: '5K' }, { y: 606, len: 76, c: C.red, t: '-845' }, { y: 638, len: 30, c: C.red },
  { y: 670, len: 112, c: C.red, t: '-1K' }, { y: 692, len: 104, c: C.red, t: '-1K' }, { y: 714, len: 32, c: C.red },
  { y: 736, len: 102, c: C.red, t: '-1K' }, { y: 758, len: 82, c: C.red, t: '-624' }, { y: 800, len: 70, c: C.red, t: '-774' },
  { y: 822, len: 14, c: C.red }, { y: 842, len: 18, c: C.red }, { y: 852, len: 14, c: C.red },
];
for (const g of LADDER) g.p = yToP(g.y);

// ---------- Sentimiento (subgráfico) ----------
const SENT_PATH = [[222,970],[260,973],[300,976],[360,972],[420,968],[500,965],[540,958],[580,946],[610,948],
  [650,956],[690,958],[740,944],[790,926],[830,915],[860,924],[900,948],[940,962],[980,976],[1020,986],[1055,966],
  [1085,976],[1120,986],[1160,976],[1200,990],[1240,1012],[1280,1042],[1330,1070],[1360,1084],[1400,1070],[1440,1040],
  [1470,1014],[1490,1032],[1510,1052],[1530,1024],[1555,1012],[1572,1030],[1585,1042]];
const sent = [];
for (let i = 0; i < N; i++) {
  const y = interp(SENT_PATH, bx(i)) + gauss() * 2.5;
  // un poco de la dirección de la vela para que el área respire con el precio
  const b = bars[i];
  sent.push((SUB_ZERO - y) / 0.01375 + (b.close - b.open) * 22);
}

// ---------- Toques: cuándo el precio alcanza cada nivel ----------
const touches = [];
const SUB_STEPS = 24;
function levelActiveAt(L, x) { return x >= L.x0 - 1 && x <= L.x1 + 1; }
{
  const lastTouch = new Map();
  let lastLadder = -99; // un solo destello de la escalera a la vez
  const zeroLevel = { zero: true, c: C.yellow };
  const all = [...LEVELS, zeroLevel, ...LADDER.filter((g) => g.len >= 70).map((g) => ({ ...g, ladder: g }))];
  for (let i = 1; i < N; i++) {
    const b = bars[i], x = bx(i);
    for (const L of all) {
      if (!L.zero && !L.ladder && !levelActiveAt(L, x)) continue;
      const p = L.zero ? yToP(interp(ZERO_PATH, x)) : L.p;
      if (p < b.low || p > b.high) continue;
      const cool = L.ladder ? 24 : L.zero ? 8 : 7;
      if (i - (lastTouch.get(L) ?? -99) < cool || (L.ladder && i - lastLadder < 6)) { lastTouch.set(L, i); continue; }
      lastTouch.set(L, i);
      if (L.ladder) lastLadder = i;
      // momento exacto dentro de la vela en que el precio cruza el nivel
      let u = 0.5, prev = b.open;
      for (let s = 1; s <= SUB_STEPS; s++) {
        const q = intra(b, s / SUB_STEPS);
        if ((prev - p) * (q - p) <= 0) { u = s / SUB_STEPS; break; }
        prev = q;
      }
      const fromBelow = bars[i - 1].close < p;
      touches.push({ L, i, u, t: LEAD + (i + u) * BAR, x, p, fromBelow, mark: !L.ladder });
    }
  }
}

// ---------- Dibujo ----------
function px(n) { return n; }
function drawFrame() {
  // fondo gris de NinjaTrader con un leve degradado
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, '#828282'); g.addColorStop(0.55, '#8a8a8a'); g.addColorStop(1, '#7e7e7e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // barra de herramientas
  ctx.fillStyle = '#f2f2f2'; ctx.fillRect(0, 0, W, 31);
  ctx.fillStyle = '#c8c8c8'; ctx.fillRect(0, 31, W, 1);
  ctx.fillStyle = '#e8501f'; ctx.fillRect(0, 2, 52, 27);
  ctx.fillStyle = '#fff'; ctx.font = '600 15px Arial, Helvetica, sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText('Chart', 7, 16);
  const box = (x, w, label) => {
    ctx.fillStyle = '#fff'; ctx.fillRect(x, 5, w, 21);
    ctx.strokeStyle = '#7a7a7a'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, 5.5, w, 21);
    ctx.fillStyle = '#111'; ctx.font = '14px Arial, Helvetica, sans-serif'; ctx.fillText(label, x + 5, 16);
    ctx.beginPath(); ctx.moveTo(x + w - 14, 13); ctx.lineTo(x + w - 6, 13); ctx.lineTo(x + w - 10, 19); ctx.closePath(); ctx.fill();
  };
  box(74, 138, 'NQ 09-26'); box(222, 140, '700 Volume');
  ctx.fillStyle = '#333';
  for (let k = 0; k < 11; k++) { ctx.fillRect(380 + k * 32, 9, 14, 13); }
  ctx.fillStyle = '#f2f2f2';
  for (let k = 0; k < 11; k++) { ctx.fillRect(382 + k * 32, 11, 10, 9); }
  ctx.fillStyle = '#111'; ctx.font = '14px Arial, Helvetica, sans-serif'; ctx.fillText('RT Magneto', 740, 16);
  // marcos de paneles
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.4;
  ctx.strokeRect(7, MAIN_TOP, AXIS_X - 7, MAIN_BOT - MAIN_TOP);
  ctx.strokeRect(7, SUB_TOP, AXIS_X - 7, SUB_BOT - SUB_TOP);
  // eje de precios
  ctx.fillStyle = '#7f7f7f'; ctx.fillRect(AXIS_X + 1, MAIN_TOP, W - AXIS_X, SUB_BOT - MAIN_TOP);
  ctx.fillStyle = '#141414'; ctx.font = '12px Arial, Helvetica, sans-serif'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 1;
  for (let p = 28980; p <= 29320; p += 20) {
    const y = pToY(p);
    ctx.beginPath(); ctx.moveTo(AXIS_X, y); ctx.lineTo(AXIS_X + 5, y); ctx.stroke();
    ctx.fillText(p.toFixed(2), AXIS_X + 9, y);
  }
  for (let v = -10000; v <= 4000; v += 2000) {
    const y = subY(v);
    ctx.beginPath(); ctx.moveTo(AXIS_X, y); ctx.lineTo(AXIS_X + 5, y); ctx.stroke();
    ctx.fillText(String(v), AXIS_X + 9, y);
  }
  // botones de panel
  for (const y of [42, 882]) { ctx.fillStyle = '#d9d9d9'; ctx.fillRect(1975, y, 18, 18); ctx.strokeStyle = '#555'; ctx.strokeRect(1975.5, y + 0.5, 18, 18); }
  // marcas de tiempo inferiores
  ctx.fillStyle = '#222';
  for (let x = 35; x < AXIS_X; x += 59) ctx.fillRect(x, SUB_BOT, 1, 6);
  // línea de inicio de sesión
  ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(SESSION_X, MAIN_TOP); ctx.lineTo(SESSION_X, SUB_BOT); ctx.stroke(); ctx.restore();
  // sesión anterior en el subgráfico
  ctx.fillStyle = '#33d433'; ctx.fillRect(22, subY(4000), 124, SUB_ZERO - subY(4000));
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(22, SUB_ZERO - 0.5, SESSION_X - 22, 1.2);
}

function dot(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function glowLine(y, x0, x1, color, k) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const band = ctx.createLinearGradient(0, y - 20, 0, y + 20);
  band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(0.5, hexA(color, 0.6 * k)); band.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = band; ctx.fillRect(x0, y - 20, x1 - x0, 40);
  ctx.fillStyle = hexA(color, 0.9 * k); ctx.fillRect(x0, y - 1.2, x1 - x0, 2.4);
  ctx.restore();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a))})`;
}

function renderAt(tIn) {
  const t = ((tIn % DURATION) + DURATION) % DURATION;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  drawFrame();

  // progreso de la sesión
  const st = Math.max(0, Math.min(SESSION, t - LEAD));
  let cur = Math.min(N - 1, Math.floor(st / BAR));
  let u = st >= SESSION ? 1 : (st - cur * BAR) / BAR;
  const fade = t > LEAD + SESSION + HOLD ? 1 - (t - LEAD - SESSION - HOLD) / FADE : 1;
  if (t < LEAD) { cur = -1; }
  ctx.globalAlpha = Math.max(0, fade);

  ctx.save();
  ctx.beginPath(); ctx.rect(8, MAIN_TOP + 1, AXIS_X - 9, MAIN_BOT - MAIN_TOP - 2); ctx.clip();

  // estado de la vela en curso
  let live = null;
  if (cur >= 0) {
    const b = bars[cur];
    const price = intra(b, u);
    let hi = Math.max(b.open, price), lo = Math.min(b.open, price);
    for (let s = 1; s <= SUB_STEPS; s++) { const q = s / SUB_STEPS; if (q > u) break; const v = intra(b, q); hi = Math.max(hi, v); lo = Math.min(lo, v); }
    live = { i: cur, open: b.open, close: price, high: hi, low: lo };
  }
  const xNow = cur >= 0 ? bx(cur) : X0 - STEP;

  // perfil de volumen a la izquierda (se acumula con la sesión)
  const prof = new Map();
  const addVol = (lo, hi, w) => { for (let y = Math.floor(pToY(hi) / 11); y <= Math.floor(pToY(lo) / 11); y++) prof.set(y, (prof.get(y) || 0) + w); };
  for (let i = 0; i < cur; i++) addVol(bars[i].low, bars[i].high, 1);
  if (live) addVol(live.low, live.high, u);
  let maxV = 0; prof.forEach((v) => { maxV = Math.max(maxV, v); });
  const pocY = [...prof.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
  prof.forEach((v, k) => {
    const len = 8 + (v / Math.max(maxV, 6)) * 140;
    ctx.fillStyle = k === pocY ? '#1f2fff' : '#1a1af0';
    ctx.fillRect(8, k * 11 + 2, len, 6);
  });
  if (live) { ctx.fillStyle = '#35e3e8'; ctx.fillRect(8, Math.floor(pToY(live.close) / 11) * 11 + 2, 30, 6); }

  // niveles punteados: aparecen hasta la vela actual
  for (const L of LEVELS) {
    const y = pToY(L.p);
    for (const x of L.dots) { if (x > xNow + 0.5) break; dot(x, y, 2.6, L.c); }
  }
  // Zero Gamma
  for (let i = 0; i <= cur; i++) dot(bx(i), interp(ZERO_PATH, bx(i)), 2.9, C.yellow);

  // escalera GEX (siempre visible, parpadea al tocarla)
  const ladderFlash = new Map();
  for (const tc of touches) if (tc.L.ladder) {
    const age = t - tc.t; if (age >= 0 && age < 1.4) ladderFlash.set(tc.L.ladder, Math.max(ladderFlash.get(tc.L.ladder) || 0, flashK(age, 1.4)));
  }
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(8, MAIN_TOP + 1, W, MAIN_BOT - MAIN_TOP - 2); ctx.clip();
  for (const g of LADDER) {
    const k = ladderFlash.get(g) || 0;
    const breathe = cur >= 0 ? 1 + 0.03 * Math.sin(t * 2.1 + g.y * 0.07) : 1;
    const len = g.len * breathe * (1 + 0.08 * k);
    ctx.fillStyle = g.c;
    ctx.fillRect(AXIS_X - len, g.y - 2.6, len, 5.2);
    if (k > 0) glowLine(g.y, AXIS_X - len - 30, AXIS_X, g.c === C.red ? '#ff5c7a' : '#6dff6d', k);
    if (g.t) {
      ctx.font = 'bold 15px Arial, Helvetica, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      if (k > 0) { ctx.fillStyle = hexA('#ffffff', 0.85 * k); roundRect(AXIS_X - 44, g.y - 9, 42, 18, 4); ctx.fill(); }
      ctx.fillStyle = k > 0.3 ? '#111' : '#fff';
      ctx.fillText(g.t, AXIS_X - 3, g.y + 0.5);
      ctx.textAlign = 'left';
    }
  }
  // franja violeta/verde del perfil de la escalera, como en la captura
  if (cur >= 0) {
    const wedge = (y0, y1, c, len) => { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(AXIS_X, y0); ctx.lineTo(AXIS_X - len, (y0 + y1) / 2); ctx.lineTo(AXIS_X, y1); ctx.closePath(); ctx.fill(); };
    wedge(500, 516, 'rgba(155,63,208,0.85)', 300); wedge(538, 556, 'rgba(155,63,208,0.85)', 240);
    ctx.fillStyle = 'rgba(20,90,60,0.9)'; ctx.beginPath(); ctx.moveTo(AXIS_X, 522); ctx.lineTo(AXIS_X - 250, 528); ctx.lineTo(AXIS_X, 536); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.beginPath(); ctx.rect(8, MAIN_TOP + 1, AXIS_X - 9, MAIN_BOT - MAIN_TOP - 2); ctx.clip();

  // destellos de los niveles tocados
  for (const tc of touches) {
    const age = t - tc.t;
    if (age < 0 || age > 1.4 || tc.L.ladder) continue;
    const k = flashK(age, 1.4);
    const y = tc.L.zero ? interp(ZERO_PATH, tc.x) : pToY(tc.p);
    const glowC = tc.L.zero ? C.yellow : tc.L.c === C.dark ? '#ff3a3a' : tc.L.c === C.blue ? '#5a6bff' : tc.L.c;
    const x0 = tc.L.zero ? tc.x - 120 : tc.L.x0 - 6;
    const x1 = tc.L.zero ? tc.x + 30 : Math.min(tc.x + 30, tc.L.x1 + 6);
    glowLine(y, Math.max(SESSION_X, x0), x1, glowC, k);
    // los puntos del nivel se iluminan
    if (!tc.L.zero) for (const x of tc.L.dots) { if (x > tc.x + 0.5) break; dot(x, y, 2.6 + 1.6 * k, hexA('#ffffff', 0.75 * k)); }
  }
  for (const tc of touches) if (tc.L.ladder) {
    const age = t - tc.t; if (age < 0 || age > 1.4) continue;
    const k = flashK(age, 1.4);
    glowLine(pToY(tc.p), Math.max(SESSION_X, tc.x - 160), AXIS_X, tc.L.c === C.red ? '#ff5c7a' : '#6dff6d', k * 0.4);
  }

  // velas
  const drawBar = (i, b, isLive) => {
    const x = bx(i);
    const yo = pToY(b.open), yc = pToY(b.close), yh = pToY(b.high), yl = pToY(b.low);
    const up = b.close >= b.open;
    ctx.strokeStyle = '#121212'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(x, yh); ctx.lineTo(x, yl); ctx.stroke();
    const top = Math.min(yo, yc), h = Math.max(1.4, Math.abs(yc - yo));
    ctx.fillStyle = up ? '#8fd8f0' : '#3b3d42';
    ctx.fillRect(x - 2.7, top, 5.4, h);
    ctx.strokeRect(x - 2.7, top, 5.4, h);
    if (isLive) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(120,230,255,0.22)'; ctx.fillRect(x - 6, yh - 4, 12, yl - yh + 8);
      ctx.restore();
    }
  };
  for (let i = 0; i < cur; i++) drawBar(i, bars[i], false);
  if (live) drawBar(cur, live, st < SESSION);

  // anillos que quedan marcando los toques (como en la captura)
  for (const tc of touches) {
    if (!tc.mark || t < tc.t) continue;
    const age = t - tc.t;
    const y = tc.L.zero ? interp(ZERO_PATH, tc.x) : pToY(tc.p);
    const c = tc.fromBelow ? C.pink : C.ring;
    // onda expansiva
    if (age < 0.9) {
      const r = 6 + age * 46, a = 1 - age / 0.9;
      ctx.strokeStyle = hexA(c === C.pink ? '#ff4f9a' : '#7dffb0', a); ctx.lineWidth = 3 * a + 0.8;
      ctx.beginPath(); ctx.arc(tc.x, y, r, 0, Math.PI * 2); ctx.stroke();
    }
    const s = Math.min(1, age / 0.18);
    ctx.globalAlpha = Math.max(0, fade) * 0.85;
    ctx.fillStyle = hexA(c, 0.5); ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(tc.x, y, 8 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = Math.max(0, fade);
  }

  // línea y etiqueta del último precio
  if (live) {
    const y = pToY(live.close);
    ctx.save(); ctx.setLineDash([2, 3]); ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(SESSION_X, y); ctx.lineTo(AXIS_X, y); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  if (live) {
    const y = pToY(live.close);
    const q = Math.round(live.close * 4) / 4;
    ctx.fillStyle = '#000'; ctx.fillRect(AXIS_X + 2, y - 10, 66, 20);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial, Helvetica, sans-serif'; ctx.textBaseline = 'middle';
    ctx.fillText(q.toFixed(2), AXIS_X + 6, y + 0.5);
  }

  // subgráfico de sentimiento
  ctx.save();
  ctx.beginPath(); ctx.rect(SESSION_X, SUB_TOP + 1, AXIS_X - SESSION_X, SUB_BOT - SUB_TOP - 2); ctx.clip();
  if (cur >= 0) {
    const vals = [];
    for (let i = 0; i < cur; i++) vals.push([bx(i), sent[i]]);
    const prevV = cur > 0 ? sent[cur - 1] : 0;
    const b = bars[cur];
    // el valor en curso sigue el recorrido de la vela
    const span = b.close - b.open;
    const f = Math.abs(span) < 0.5 ? u : Math.max(-0.6, Math.min(1.6, (live.close - b.open) / span));
    const vNow = prevV + (sent[cur] - prevV) * f;
    vals.push([bx(cur), vNow]);
    const area = (sign, color) => {
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(SESSION_X, SUB_ZERO);
      for (const [x, v] of vals) ctx.lineTo(x, subY(sign > 0 ? Math.max(0, v) : Math.min(0, v)));
      ctx.lineTo(vals[vals.length - 1][0], SUB_ZERO); ctx.closePath(); ctx.fill();
    };
    area(1, '#33d433'); area(-1, '#9636c8');
    // punta viva
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const tipY = subY(vNow);
    const tip = ctx.createRadialGradient(bx(cur), tipY, 0, bx(cur), tipY, 18);
    tip.addColorStop(0, vNow >= 0 ? 'rgba(120,255,120,0.9)' : 'rgba(210,140,255,0.9)'); tip.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tip; ctx.fillRect(bx(cur) - 18, tipY - 18, 36, 36);
    ctx.restore();
  }
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(SESSION_X, SUB_ZERO - 0.5, AXIS_X - SESSION_X, 1.2);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function flashK(age, dur) {
  // subida rápida, dos parpadeos y apagado
  const a = age / dur;
  const env = a < 0.08 ? a / 0.08 : Math.pow(1 - (a - 0.08) / 0.92, 1.6);
  const blink = 0.72 + 0.28 * Math.cos(age * Math.PI * 2 * 3.2);
  return Math.max(0, env * blink);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

window.renderAt = renderAt;
window.TOUCHES = touches.length;
window.TOUCH_TIMES = touches.map((x) => +x.t.toFixed(2) + (x.L.ladder ? "L" : x.L.zero ? "Z" : ""));
if (!params.has('still')) {
  const t0 = performance.now();
  const loop = () => { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else {
  renderAt(Number(params.get('still')));
}
</script>
</body>
</html>
